name: Сбор и закреп (07:00 и 14:00 МСК)

on:
  # второй запуск — страховка: если первый отменила очередь Actions; повтор за день код пропустит
  schedule:
    - cron: "0 4 * * *"    # утренний сбор (07:00 МСК)
    - cron: "30 5 * * *"   # запасной утренний (08:30)
    - cron: "0 11 * * *"   # дневной сбор (14:00 МСК): днём выходят новости США; «Слово дня» — только утром
    - cron: "30 12 * * *"  # запасной дневной (15:30)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — ничего не публикует; publish — по-настоящему"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      force:
        description: "запустить, даже если за этот период уже запускалось"
        type: boolean
        default: false

# Все контуры пишут одно состояние — выполняем их строго по одному.
concurrency:
  group: vibe-stack-state
  cancel-in-progress: false

permissions:
  contents: write  # нужно только job save в _run.yml; job с контурами получает права только на чтение

jobs:
  run:
    # Расписание включается переменной репозитория VIBE_STACK_ENABLED=true (Settings → Variables).
    if: github.event_name == 'workflow_dispatch' || vars.VIBE_STACK_ENABLED == 'true'
    uses: ./.github/workflows/_run.yml
    with:
      commands: "collect pin"
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit
