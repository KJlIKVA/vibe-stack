name: Срочный + публикация (каждые 30 минут)

on:
  schedule:
    # Основной запуск — clock.yml, каждые 30 минут (решение 73). Расписание GitHub с 25.10 срабатывает лишь ~5 раз
    # в сутки и остаётся страховкой на случай, если clock.yml остановится.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — ничего не публикует; publish — по-настоящему"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      chain:
        description: "запуск из clock.yml: подчиняется VIBE_STACK_ENABLED, как расписание"
        type: boolean
        default: false

# Все контуры пишут одно состояние — выполняем их строго по одному.
concurrency:
  group: vibe-stack-state
  cancel-in-progress: false

permissions:
  contents: write  # нужно только job save в _run.yml; job с контурами получает права только на чтение

jobs:
  run:
    # Расписание включается переменной репозитория VIBE_STACK_ENABLED=true (Settings → Variables).
    # Ручной запуск работает всегда, запуск из clock.yml — только при включённом расписании.
    if: (github.event_name == 'workflow_dispatch' && inputs.chain != true) || vars.VIBE_STACK_ENABLED == 'true'
    uses: ./.github/workflows/_run.yml
    with:
      commands: "urgent publish"
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
    secrets: inherit
