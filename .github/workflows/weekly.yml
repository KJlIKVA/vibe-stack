name: Итоги недели (вс 19:00) и подборка «Что посмотреть» (вс 12:00 МСК)

on:
  # второй запуск — страховка; повторно за неделю итоги не выйдут
  schedule:
    - cron: "0 16 * * 0"   # итоги недели (19:00 МСК)
    - cron: "30 17 * * 0"  # запасной (20:30)
    - cron: "0 9 * * 0"    # подборка «Что посмотреть и послушать» (12:00 МСК)
    - cron: "30 10 * * 0"  # запасной (13:30)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run — ничего не публикует; publish — по-настоящему"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      force:
        description: "запустить, даже если за этот период уже запускалось"
        type: boolean
        default: false
      contour:
        description: "weekly — итоги недели; watchlist — подборка «Что посмотреть и послушать»"
        type: choice
        options: [weekly, watchlist]
        default: weekly

# Все контуры пишут одно состояние — выполняем их строго по одному.
concurrency:
  group: vibe-stack-state
  cancel-in-progress: false

permissions:
  contents: write  # нужно только job save в _run.yml; job с контурами получает права только на чтение

jobs:
  run:
    # Расписание включается переменной репозитория VIBE_STACK_ENABLED=true (Settings → Variables).
    if: github.event_name == 'workflow_dispatch' || vars.VIBE_STACK_ENABLED == 'true'
    uses: ./.github/workflows/_run.yml
    with:
      commands: ${{ github.event_name == 'workflow_dispatch' && inputs.contour || ((github.event.schedule == '0 9 * * 0' || github.event.schedule == '30 10 * * 0') && 'watchlist' || 'weekly') }}
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit
