# Vibe Stack — конфигурация пайплайна.
# Секреты здесь не хранятся: только переменные окружения (см. .env.example).
# Notion (таблицы «Рубрики», «Источники», «Настройки») может переопределять часть значений во время работы.

channel:
  name: Vibe Stack
  tz: Asia/Tokyo  # решение 67: канал работает по японскому времени (до 15.10 — Europe/Moscow)
  # @username канала без «@» — нужен для ссылок на посты в «Итогах недели».
  # Пусто — ссылки строятся по TELEGRAM_CHANNEL_ID (вид t.me/c/...).
  username: "vibestack_off"

llm:
  provider: openai
  base_url: null              # null = https://api.openai.com/v1
  max_calls_per_run: 150      # MAX_LLM_CALLS_PER_RUN (60 кандидатов за сбор: оценка + проверка + текст)
  daily_budget_usd: null      # лимит в долларах выключен: расход ограничивает лимит токенов ниже
  # Жёсткий дневной лимит токенов на модель (вход + выход с рассуждением), сутки по UTC — как у OpenAI.
  # Вызов, который может выйти за лимит (оценка входа + max_output_tokens шага), не делается.
  daily_token_limits:
    gpt-5.6-terra: 2000000
  request_timeout_s: 180
  max_attempts: 2             # попыток на вызов (таймаут, 5xx, 429); каждая — в лимите и бюджете
  # Цены за 1M токенов (USD), контекст до 272K — для подсчёта бюджета (сверено 2026-10-07).
  # Если cached_input не задан, кэш считается по цене input (с запасом).
  # Модель без цены здесь — запуск откажется её вызывать, чтобы бюджет не считался «бесплатным».
  prices_per_1m:
    gpt-5.6-terra: {input: 2.50, cached_input: 0.25, output: 15.00}
    gpt-5.6-luna: {input: 1.00, output: 6.00}
    gpt-5.6-sol: {input: 5.00, output: 30.00}
  # Модели и effort по шагам. Имена моделей — только здесь.
  # max_output_tokens включает токены рассуждения.
  steps:
    score:   {model: gpt-5.6-terra, effort: low,    max_output_tokens: 6000}    # промпт A
    verify:  {model: gpt-5.6-terra, effort: medium, max_output_tokens: 12000}   # промпт B
    write:   {model: gpt-5.6-terra, effort: medium, max_output_tokens: 8000}    # промпт C
    triage:  {model: gpt-5.6-terra, effort: medium, max_output_tokens: 6000}    # промпт U (срочное); medium — решение 69
    weekly:  {model: gpt-5.6-terra, effort: medium, max_output_tokens: 8000}    # промпт D
    image:   {model: gpt-5.6-terra, effort: low,    max_output_tokens: 3000}    # промпт I (картинка к посту о модели)

limits:
  regular_per_day: 32         # потолок, а не план: все слоты дня (решение 59: важнее не обрезать свежее)
  # у срочных лимита нет (решение 65); 20 в день — предохранитель на случай сбоя: дальше срочные ждут в очереди
  # обычных, админу — оповещение. «Лимит срочных» в Notion не читается.
  urgent_per_day: 20

gate:
  min_total: 10               # из 15
  min_verifiability: 2
  max_age_days: 30            # старше — hard stop outdated (по дате создания/обновления)
  min_approved_claims: 2
  # «Книга/видео» (решение 49): только то, что реально стоит часа — польза не ниже 4 из 5
  min_usefulness: {book_video: 4}
  # обсуждения Reddit (решение 64): только «Приём» или «Кейс», сумма от 11 и польза от 4 из 5 — только реально полезное
  discussion: {rubrics: [trick, case], min_total: 11, min_usefulness: 4}
  # видео и подкасты (решение 68): сумма от 13, польза от 4 и audience_fit 2 — понятно и применимо вайбкодеру;
  # книги — по общим порогам «Книги/видео»
  watch: {min_total: 13, min_usefulness: 4, min_audience_fit: 2}
  # решение 70: только действительно интересное — interest от 4 из 5 (событие недели, заметная новинка, популярный
  # проект по теме). Сколько постов выйдет за день, не важно. «Книга/видео» — по своим порогам пользы выше
  min_interest: 4
  min_interest_exempt: [book_video]

schedule:
  # в channel.tz: каждые 30 минут с 08:00 до 23:30, ночью канал молчит; в слот — не больше одного поста
  publish_slots: ["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30",
                  "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30",
                  "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30",
                  "20:00", "20:30", "21:00", "21:30", "22:00", "22:30", "23:00", "23:30"]
  slot_window_minutes: 30     # слот активен до следующего; тик (tick.yml) — каждые 10 минут
  queue_max_age_days: 5       # одобренный, но не вышедший пост старше этого устаревает
  queue_max_age_days_by: {"book_video:book": 30}  # книга ждёт своей недели, а не устаревает за 5 дней

planner:
  topic_repeat_days: 7
  topic_similarity: 0.5       # порог сходства заголовков (Jaccard по словам)
  max_per_domain_per_day: 3   # у репозиториев GitHub «домен» — владелец (github.com/owner)
  weekly_min: {analysis: 1}
  # «Книга/видео» (решения 50, 52): ключ «рубрика:группа» — book_video:watch (видео и подкасты),
  # book_video:book (книги). Группа — по хештегу поста. При очереди группы от backlog_queue (считая вышедшие
  # за день или неделю) действует backlog_*.
  # видео/подкаст — раз в день, если прошло отбор; книга — не больше одной в день (решение 60)
  daily_max: {book_video: 3, "book_video:watch": 1, "book_video:book": 1}
  # …при очереди от 5 — до четырёх видео в день (решение 62: при двух очередь росла и видео устаревали)
  backlog_daily_max: {book_video: 5, "book_video:watch": 4}
  weekly_max: {"book_video:book": 1}                 # книга — раз в неделю
  backlog_weekly_max: {"book_video:book": 3}         # …при очереди книг от 5 — до трёх в неделю
  backlog_queue: 5

collect:
  max_candidates_to_score: 80 # сколько кандидатов за запуск идут в LLM (решение 59; повторы тем отсеиваются до оценки)
  max_per_source: 8           # не больше стольких от одного источника за запуск (источники идут по очереди)
  max_minutes: 30             # дедлайн сбора; оставшиеся кандидаты ждут следующего сбора
  code_injection_guard: true  # код сам ставит injection_detected по явным фразам, не дожидаясь LLM

urgent:
  max_item_age_hours: 24
  new_model_max_chars: 1200   # пост о новой модели: для чего, сравнение и бенчмарки, цена (решения 47, 65)
  events: [new_model, major_release, pricing_or_limits_change, vulnerability]

# Картинка поста — большое превью над текстом: главная картинка страницы (og:image) или карточка репозитория
# GitHub. Для поста о новой модели модель выбирает среди картинок статьи таблицу бенчмарков или цен (решение 47).
images:
  enabled: true
  max_figures: 8              # сколько картинок статьи показывать модели (detail=low, ~100 токенов каждая)

fetch:
  timeout_s: 20
  max_bytes: 3000000
  max_doc_chars: 24000
  user_agent: "VibeStackBot/0.1 (+https://github.com/KJlIKVA/vibe-stack)"
  # openai.com отвечает роботам из GitHub Actions 403 — тогда берём последнюю копию страницы из web.archive.org
  archive_fallback_hosts: [openai.com]
  # решение 65: запись release notes Claude о выходе модели дополняется её анонсом на anthropic.com (бенчмарки, цена)
  model_pages:
    platform.claude.com: {id: "claude-[a-z]+-[0-9][a-z0-9-]*", url: "https://www.anthropic.com/{id}"}

dedup:
  seen_ttl_days: 60           # отклонённое не пересматриваем столько дней; опубликованное — никогда

prefilter:
  blocked_domains: [medium.com/tag, linkedin.com, facebook.com, x.com, twitter.com, youtube.com/shorts]
  pirate_domains: [libgen.is, libgen.rs, libgen.li, z-lib.org, z-library.sk, annas-archive.org, annas-archive.se, sci-hub.se, pdfdrive.com]
  affiliate_params: [ref, aff, affid, aff_id, affiliate, affiliate_id, via, partner, partner_id, tag, irclickid, clickid]

rubrics:
  # mode: auto | approve. enabled=false — рубрика выключена. Таблица «Рубрики» в Notion переопределяет оба поля.
  tool:       {emoji: "🛠", hashtag: "#инструмент", title: "🛠 Инструмент", mode: auto, enabled: true, max_chars: 900, overlay: standard}
  skill_mcp:  {emoji: "🧩", hashtag: "#skill",      title: "🧩 Skill/MCP",  mode: auto, enabled: true, max_chars: 900, overlay: standard}
  trick:      {emoji: "💡", hashtag: "#приём",      title: "💡 Приём",      mode: auto, enabled: true, max_chars: 900, overlay: standard}
  case:       {emoji: "🔍", hashtag: "#кейс",       title: "🔍 Кейс",       mode: auto, enabled: true, max_chars: 900, overlay: standard}
  urgent:     {emoji: "🚨", hashtag: "#срочно",     title: "🚨 Срочно",     mode: auto, enabled: true, max_chars: 500, overlay: urgent}
  book_video: {emoji: "📚", hashtag: "#книга",      title: "📚 Книга/видео", mode: auto, enabled: true, max_chars: 800, overlay: book_video}
  benchmark:  {emoji: "📊", hashtag: "#бенчмарк",   title: "📊 Бенчмарк",   mode: auto, enabled: true, max_chars: 900, overlay: benchmark}
  analysis:   {emoji: "🧠", hashtag: "#разбор",     title: "🧠 Разбор",     mode: auto, enabled: true, max_chars: 1500, overlay: analysis}
  weekly:     {emoji: "📋", hashtag: "#итоги",      title: "📋 Итоги недели", mode: auto, enabled: true, max_chars: 1200, overlay: weekly}


# Рейтинги в закрепе (раздел 5). Только разрешённые способы доступа — см. docs/decisions.md.
leaderboards:
  # Arena (датасет lmarena-ai/leaderboard-dataset): текст — общий рейтинг в чате; кодинг — категория coding
  # того же рейтинга (вопросы про код: скрипты, функции, отладка); WebDev — Code Arena: модель собирает сайт или
  # веб-приложение по описанию, люди сравнивают готовый результат; агенты — Agent Arena: модель с инструментами
  # сама выполняет задачу (код, анализ) в Agent Mode на arena.ai, рейтинг считается по реальным сессиям;
  # изображения и видео — генерация по тексту.
  - {key: arena_text, type: arena_hf, label: "Текст", dataset_config: text_style_control}
  - {key: arena_coding, type: arena_hf, label: "Кодинг", dataset_config: text_style_control, category: coding}
  - {key: arena_webdev, type: arena_hf, label: "WebDev — сайты и приложения", dataset_config: webdev}
  - {key: arena_agent, type: arena_hf, label: "Агенты", dataset_config: agent}
  # Alignment Index (решение 62): как часто агент действует без спроса, искажает слова пользователя или выдаёт
  # недоделанное за готовое; чем выше, тем надёжнее. На arena.ai с 08.10.2026, в датасете HF его пока нет —
  # срез задан шаблоном: пока его нет, строки в закрепе нет и оповещений нет; появится — блок встанет сам,
  # а админу один раз придёт «появился рейтинг».
  - {key: arena_alignment, type: arena_hf, label: "Агенты: надёжность (Alignment Index)", dataset_config: "*align*"}
  - {key: arena_image, type: arena_hf, label: "Изображения", dataset_config: text_to_image}
  - {key: arena_video, type: arena_hf, label: "Видео", dataset_config: text_to_video}
  # Условия API Artificial Analysis не разрешают ежедневный топ без письменного согласия.
  # Включить (enabled: true + секрет AA_API_KEY) только после разрешения: artificialanalysis.ai/data-api#contact
  - {key: aa_index, type: artificial_analysis, label: "Artificial Analysis", enabled: false}

# Источники. contours: в каких контурах опрашивать. official_domains — для белого списка срочных:
# срочным может быть только материал с этих доменов и только из источника с whitelist: true.
# Песочница (фаза 3): пакет находки ставится и запускается с --help в изолированном контейнере GitHub Actions
# (.github/workflows/sandbox.yml). Пакет берётся из команды установки в README и принимается, только если
# реестр (PyPI/npm) ссылается на тот же репозиторий GitHub, а происхождение подтверждено (provenance или манифест
# репозитория). Если запуск прошёл — код добавляет в пост «🧪 Запущено в песочнице»; если нет — пост выходит как обычно.
sandbox:
  # Включена 2026-10-08 после исправлений по двум ревью безопасности (docs/decisions.md, решения 43–46).
  # Выключить: false — посты выходят без пометки, остальное работает.
  enabled: true
  rubrics: [tool, skill_mcp]
  ecosystems: [pypi, npm]
  max_wait_minutes: 120       # столько публикация ждёт результата, потом пост выходит без пометки
  max_requests_per_run: 10
  max_age_hours: 24           # заявку старше этого в песочницу не отдаём (вышедший пост закрывает заявку сразу)
  max_attempts: 2             # сколько раз запуск может оборваться на заявке, потом она считается «не запустилась»
  # Происхождение пакета (решение 44): false — provenance из репозитория поста ИЛИ имя пакета в манифесте
  # репозитория; true — только provenance (строже: без пометки останется больше половины пакетов)
  require_provenance: false

# Сводка дня админу в личку (время — cron в .github/workflows/digest.yml, 23:45 по Японии)
digest:
  enabled: true

sources:
  - name: openai-news
    type: rss
    url: https://openai.com/news/rss.xml
    whitelist: true
    model_vendor: true
    official_domains: [openai.com]
    contours: [collect, urgent]
  - name: openai-api-changelog
    # решение 48: страницы openai.com из GitHub Actions закрыты (403), а официальный changelog API открыт.
    # Каждая запись (новая модель, API, цены, лимиты) — отдельный кандидат, в том числе для срочного контура.
    type: md_changelog
    url: https://developers.openai.com/api/docs/changelog
    title_prefix: "OpenAI API: "
    max_age_days: 3   # в changelog записи за месяцы — новостью считаем только последние дни
    group_by_day: true  # решение 70: записи одного дня — один пост (срочный контур смотрит каждую отдельно)
    whitelist: true
    model_vendor: true
    official_domains: [openai.com]
    contours: [collect, urgent]
  - name: claude-release-notes
    # решение 65: новые модели Anthropic анонсирует не в /news/, а на страницах вида anthropic.com/claude-haiku-5-5
    # без даты в sitemap — их ловим по датированным release notes API. Запись о выходе модели код дополняет
    # анонсом (fetch.model_pages) и описанием модели из документации; каждая запись — отдельный кандидат.
    type: md_changelog
    url: https://platform.claude.com/docs/en/release-notes/overview
    title_prefix: "Claude API: "
    max_age_days: 3
    group_by_day: true  # решение 70: 20.10 три пункта о web fetch вышли тремя постами за час
    whitelist: true
    model_vendor: true
    official_domains: [claude.com, anthropic.com]
    contours: [collect, urgent]
  - name: anthropic-news
    type: sitemap
    url: https://www.anthropic.com/sitemap.xml
    path_prefix: /news/
    whitelist: true
    model_vendor: true
    official_domains: [anthropic.com]
    contours: [collect, urgent]
    # RSS у Anthropic нет. Новая страница в /news/ = кандидат; заголовок и дату публикации код берёт со страницы
  - name: claude-articles
    # решение 70: продукты Claude Anthropic анонсирует на claude.com/resources/articles (Claude Duet 21.10, итоги
    # хакатонов), а не в anthropic.com/news. В sitemap claude.com нет дат: новая страница — адрес, которого не было
    # при прошлых опросах; дату публикации код сверяет по странице
    type: sitemap
    url: https://claude.com/sitemap.xml
    path_prefix: /resources/articles/
    first_poll_new: ["https://claude.com/resources/articles/claude-duet",
                     "https://claude.com/resources/articles/claude-security-now-scans-continuously-and-tracks-fixes",
                     "https://claude.com/resources/articles/code-review-is-now-generally-available"]
    whitelist: true
    model_vendor: true
    official_domains: [claude.com]
    contours: [collect, urgent]
  - name: anthropic-engineering
    type: sitemap
    url: https://www.anthropic.com/sitemap.xml
    path_prefix: /engineering/
    whitelist: true
    official_domains: [anthropic.com]
    contours: [collect]
  - name: google-deepmind-blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    whitelist: true
    model_vendor: true
    official_domains: [deepmind.google, blog.google]
    contours: [collect, urgent]
  # решение 70: другие компании — разработчики моделей. Mistral Large 4 и DeepSeek V4.1 до нас дошли только через
  # Hugging Face и Reddit, а xAI не было совсем
  - name: mistral-news
    type: rss
    url: https://mistral.ai/rss.xml
    whitelist: true
    model_vendor: true
    official_domains: [mistral.ai]
    contours: [collect, urgent]
  - name: deepseek-news
    # новости API DeepSeek (выход моделей, цены); в sitemap нет дат — новая страница = новый адрес
    type: sitemap
    url: https://api-docs.deepseek.com/sitemap.xml
    path_prefix: /news/
    whitelist: true
    model_vendor: true
    official_domains: [deepseek.com]
    contours: [collect, urgent]
  - name: xai-news
    type: sitemap
    url: https://x.ai/sitemap.xml
    path_prefix: /news/
    whitelist: true
    model_vendor: true
    official_domains: [x.ai]
    contours: [collect, urgent]
  - name: meta-ai-research
    # решение 70: модели Meta (Muse Spark Open, Muse Wonder) — у блога нет RSS и дат в sitemap: новые ссылки со
    # страницы блога, дата — первое появление
    type: page_links
    url: https://research.meta.ai/blog
    path_prefix: /blog/
    whitelist: true
    model_vendor: true
    official_domains: [research.meta.ai]
    contours: [collect, urgent]
  - name: github-changelog
    type: rss
    url: https://github.blog/changelog/feed/
    pages: 3  # решение 70: в ленте 10 записей, за полдня выходит больше — Copilot computer use (01.10) мы не увидели
    # решение 70: только про Copilot и ИИ — Dependabot, раннеры, правила веток и токены вайбкодеру неинтересны
    include_text_regex: ["copilot|\\bagents?\\b|agentic|\\bAI\\b|\\bMCP\\b|\\bLLMs?\\b|\\bmodels?\\b|codex|claude|gemini|spark"]
    whitelist: true
    official_domains: [github.blog]
    contours: [collect, urgent]
  - name: claude-code-releases
    type: github_releases
    repo: anthropics/claude-code
    whitelist: true
    official_domains: [github.com]
    contours: [collect, urgent]
  - name: codex-releases
    type: github_releases
    repo: openai/codex
    whitelist: true
    official_domains: [github.com]
    contours: [collect, urgent]
  - name: gemini-cli-releases
    type: github_releases
    repo: google-gemini/gemini-cli
    whitelist: true
    official_domains: [github.com]
    contours: [collect, urgent]
  - name: google-developers-blog
    # в RSS нет дат — для срочного контура не годится, дату публикации код берёт со страницы
    type: rss
    url: https://developers.googleblog.com/rss/
    # решение 70: только Gemini, агенты и ИИ-инструменты — TPU, OAuth и компиляторы для edge вайбкодеру неинтересны
    include_text_regex: ["gemini|gemma|\\bagents?\\b|agentic|\\bADK\\b|\\bMCP\\b|jules|antigravity|AI Studio|stitch|vibe|\\bLLMs?\\b"]
    whitelist: true
    official_domains: [developers.googleblog.com]
    contours: [collect]
  - name: cursor-changelog
    type: rss
    url: https://cursor.com/changelog/rss.xml
    whitelist: true
    official_domains: [cursor.com]
    contours: [collect, urgent]
  - name: huggingface-blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    contours: [collect]
  - name: aider-releases
    type: github_releases
    repo: Aider-AI/aider
    contours: [collect]
  - name: cline-releases
    type: github_releases
    repo: cline/cline
    contours: [collect]
  - name: reddit
    # Решение 64: лучшее за день из сабреддитов по теме одним запросом (Reddit пускает ~1 запрос в минуту).
    # Пост со ссылкой на GitHub или Hugging Face — проект; со ссылкой на статью — статья (как в решении 48).
    # В discussion_subreddits пост со своим текстом от min_body_chars — обсуждение: первоисточник — ветка (пост и
    # лучшие комментарии), рубрика только «Приём» или «Кейс», пороги строже (gate.discussion в коде).
    # Картинки и видео без текста, мемы — не берём. Выключить обсуждения: discussion_subreddits: [].
    type: reddit
    url: https://www.reddit.com/r/ClaudeAI+ClaudeCode+codex+vibecoding+LocalLLaMA/top/.rss?t=day&limit=75
    contours: [collect]
    discussion_subreddits: [ClaudeAI, ClaudeCode, codex, vibecoding]
    min_body_chars: 400
    skip_title_regex: ["(?i)\\b(meme|humor|funny|rant|shitpost|joke)\\b"]
  - name: lobsters-ai
    type: rss
    url: https://lobste.rs/t/ai.rss
    contours: [collect]
  # --- что посмотреть, послушать, почитать (рубрика «Книга/видео», решение 48) ---
  - name: latent-space
    # подкаст и статьи о AI-инженерии; у выпусков есть полная расшифровка — по ней можно сверить факты
    type: rss
    url: https://www.latent.space/feed
    contours: [collect]
  - name: youtube
    # YouTube Data API: RSS и страницы YouTube из GitHub Actions закрыты. Работает, только если в секретах GitHub
    # есть YOUTUBE_API_KEY; без ключа источник молча пропускается. Каналы: AI Engineer (доклады конференций),
    # Anthropic, OpenAI, Google for Developers, Google DeepMind, Andrej Karpathy, Latent Space.
    type: youtube
    contours: [collect]
    channels: [UCLKPca3kwwd-B59HNr-_lvA, UCrDwWp7EBBv4NwvScIpBDOA, UCXZCJLdBC09xxGZ6gcdrc6A,
               UC_x5XG1OV2P6uZZ5FSM9Ttw, UCP7jMXSY2xbc3KCAE0MHQ-A, UCXUPKJO5MZQN11PqgIvyuvQ,
               UCvi5jNRoRVm436TVAXet1kQ]
    skip_title_regex: ["#shorts"]  # вертикальные клипы Shorts; длину остальных видео не ограничиваем (решение 51)
  # книги (решение 50): правила оценки — «книги» в score_notes.txt; книга актуальна дольше новости — 180 дней
  - name: manning-books
    # у Manning нет RSS: каталог (сортировка «newest») отдаёт 40 последних книг списком JSON-LD; ИИ-книг
    # там больше всего, включая ранний доступ (MEAP) — главы выходят до выхода книги
    type: jsonld_list
    url: https://www.manning.com/catalog
    contours: [collect]
    media: book
    max_age_days: 180
    include_title_regex: ["\\b(AI|LLMs?|GPT|Claude|Agents?|Agentic|Prompt\\w*|Machine Learning|Copilot|Generative|MCP|DSPy|RAG|Evals?)\\b"]
  - name: pragprog-books
    # новые книги Pragmatic Bookshelf — только про ИИ и разработку с ИИ (лента обновляется редко)
    type: rss
    url: https://pragprog.com/feed/global
    contours: [collect]
    media: book
    max_age_days: 180
    include_title_regex: ["\\b(AI|LLMs?|GPT|Claude|Agents?|Agentic|Prompt\\w*|Machine Learning|Copilot|Generative|MCP|DSPy|RAG|Evals?)\\b"]
  - name: apress-books
    # Apress (решение 53): новые книги про ИИ находит Open Library, страница книги — Springer по ISBN
    # (дата выхода, описание, оглавление). Книги «скоро выйдет» отсеивает оценка: не вышла — не рекомендуем.
    type: openlibrary
    query: 'publisher:"Apress" AND (subject:"artificial intelligence" OR title:AI OR title:LLM OR title:agents OR title:agentic OR title:generative OR title:prompt OR title:LangChain OR title:MCP OR title:Copilot)'
    url_template: "https://link.springer.com/book/{isbn}"
    contours: [collect]
    media: book
    max_age_days: 180
    include_title_regex: ["\\b(AI|LLMs?|GPT|Claude|Agents?|Agentic|Prompt\\w*|Machine Learning|Copilot|Generative|MCP|DSPy|RAG|Evals?|LangChain|LangGraph)\\b"]
  - name: nostarch-books
    # No Starch Press: новинки редко, но бывают практические книги по ИИ
    type: rss
    url: https://nostarch.com/rss.xml
    contours: [collect]
    media: book
    max_age_days: 180
    include_title_regex: ["\\b(AI|LLMs?|GPT|Claude|Agents?|Agentic|Prompt\\w*|Machine Learning|Copilot|Generative|MCP|DSPy|RAG|Evals?)\\b"]
  - name: claude-dev
    # решение 64: блог разработчиков Anthropic о работе с Claude и Claude Code — советы и приёмы; за месяц до
    # решения вышло 9 статей, а к нам через HN попала одна
    type: rss
    url: https://claude.dev/rss.xml
    whitelist: true
    official_domains: [claude.dev]
    contours: [collect]
