  - name: cerebral-valley-hackathons
    # решение 70: хакатоны Anthropic, OpenAI, Google и других — на Cerebral Valley («Built with Claude: Japan»);
    # официальных анонсов на сайтах компаний нет. Из тысяч событий — только с именем компании в адресе
    type: sitemap
    url: https://cerebralvalley.ai/sitemap.xml
    path_prefix: /e/
    include_text_regex: ["^/e/[^/]*(claude|anthropic|openai|codex|chatgpt|gemini|google|deepmind|cursor|copilot|github|mistral|meta|xai|grok)[^/]*$"]
    contours: [collect]
  - name: android-developers
    # решение 70: Gemini в Android Studio, приложения, собранные в AI Studio, — только записи про ИИ
    type: rss
    url: https://android-developers.googleblog.com/feeds/posts/default
    include_text_regex: ["gemini|\\bagents?\\b|agentic|\\bAI\\b|vibe|\\bMCP\\b|\\bLLMs?\\b"]
    contours: [collect]
  - name: jetbrains-ai
    # решение 70: блог JetBrains об ИИ — агент Air, модели Mellum, ИИ в IDE; выходит раз в неделю-две
    type: rss
    url: https://blog.jetbrains.com/ai/feed/
    contours: [collect]
  - name: vscode-updates
    # заметки к выпускам VS Code и блог: новости Copilot и агентов в редакторе; сборки Insiders — не выпуск
    type: rss
    url: https://code.visualstudio.com/feed.xml
    contours: [collect]
    skip_title_regex: ["(?i)insiders"]
    max_age_days: 14  # выпуск VS Code — каждую неделю: прошлые выпуски в очередь не берём
  - name: simon-willison
    # решение 70: только статьи — в ленте «everything» были выпуски его плагинов (llm-echo 0.5) и короткие заметки
    type: rss
    url: https://simonwillison.net/atom/entries/
    whitelist: false
    contours: [collect]
    skip_title_regex: ["^Quoting "]   # короткие цитаты без собственного содержания
  - name: github-search
    # новые репозитории за месяц, самые звёздные по каждому запросу. Решение 70: ищем по имени, описанию и темам, а
    # не только по меткам (популярные проекты часто без меток); от 100 звёзд — меньше сырых проектов
    type: github_search
    contours: [collect]
    per_query: 10
    min_stars: 100
    queries:
      - "claude in:name,description,topics"
      - "codex in:name,description,topics"
      - "mcp in:name,description,topics"
      - "topic:agent-skills"
      - "vibe coding in:name,description,topics"
      - "ai agent in:name,description,topics"
      - "llm in:name,description,topics"
      - "gemini in:name,description,topics"
  - name: github-trending
    # решение 70: проекты, которые набирают звёзды сейчас (github.com/trending за день и неделю), в том числе старше
    # месяца. Только про ИИ и не меньше min_stars звёзд за период; о чём проект и интересен ли он — решает оценка
    type: github_trending
    contours: [collect]
    min_stars: 150
    include_text_regex: ["\\b(AI|LLMs?|agents?|agentic|claude|codex|GPT|MCP|copilot|cursor|gemini|prompts?|RAG|skills?|vibe|models?|chatgpt|openai|anthropic|deepseek|qwen|kimi)\\b"]
  - name: hackernews
    type: hackernews
    contours: [collect]
    min_points: 100  # решение 70: Show HN на 60 очков — чаще всего проходные проекты
    per_query: 15
    queries: ["Claude Code", "Codex", "MCP server", "AI agent", "vibe coding", "LLM coding"]
  - name: hackernews-top
    # решение 70: главная HN без поисковых слов — всё про ИИ от 200 очков. По словам выше не находились Mistral
    # Large 4, DeepSeek V4.1 Flash, DeepInfer (2315 очков), Claude Duet. HN — только способ найти: в пост идёт
    # ссылка на первоисточник
    type: hackernews
    contours: [collect]
    min_points: 200
    per_query: 100
    queries: [""]
    include_text_regex: ["\\b(AI|LLMs?|GPT|Claude|Anthropic|OpenAI|Gemini|Gemma|Codex|Copilot|Cursor|agents?|agentic|MCP|DeepSeek|Qwen|Kimi|Mistral|Llama|vibe|prompts?|models?)\\b"]
