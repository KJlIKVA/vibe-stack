    official_domains: [github.blog]
    document:
      text: |
        GitHub CLI: Opt in to expiring, auto-refreshing OAuth tokens

        You can now opt in to expiring OAuth tokens in GitHub CLI. Expiring tokens are refreshed
        automatically, so you no longer need to keep a long-lived token on disk.

        To sign in with expiring tokens, run `gh auth login --expiring`. To turn the mode on for all new
        sign-ins, run `gh config set expiring_credentials enabled`.

        Scripts and extensions that store the output of `gh auth token` and reuse it later may stop working
        once the token expires. Use `gh auth setup-git` so Git asks GitHub CLI for credentials on HTTPS
        operations.
