        --- README ---
        # mcp-postgres-inspector

        An MCP (Model Context Protocol) server that gives AI agents **read-only** access to your
        PostgreSQL schema: tables, columns, indexes and foreign keys. The agent can explore the real
        structure of your database before writing queries or migrations.

        ## Install

        Add it to Claude Code:

            claude mcp add pg-inspector -- npx -y @acme-labs/mcp-postgres-inspector

        Pass the connection string via the `DATABASE_URL` environment variable.

        ## Requirements and limitations

        - PostgreSQL 13 or newer.
        - Read-only: the server never runs INSERT, UPDATE or DELETE.
        - Row data is not exposed, only the schema.

        ## Changelog

        v0.4.0 — added index and foreign key listing.
