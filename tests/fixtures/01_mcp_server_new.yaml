        Сервер даёт ИИ-агенту доступ только на чтение к схеме базы PostgreSQL: таблицы, колонки, индексы и внешние ключи.

        <b>Зачем это вам:</b> агент в Claude Code видит реальную структуру базы и пишет запросы и миграции без догадок.
        <b>Как попробовать за 5 минут:</b> выполните <code>claude mcp add pg-inspector -- npx -y @acme-labs/mcp-postgres-inspector</code> и передайте строку подключения в переменной DATABASE_URL.
        <b>Подводный камень:</b> нужен PostgreSQL 13 или новее, а данные строк сервер не показывает — только схему.

