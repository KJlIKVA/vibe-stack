candidates:
  - source: simon-willison
    source_type: rss
    url: https://blog.example-dev.net/why-agents-need-agents-md
    title: Why every repo needs an AGENTS.md
    published_days_ago: 2
    document:
      text: |
        Why every repo needs an AGENTS.md

        Coding agents read the repository before they act. Without written conventions they guess:
        which test command to run, which directories are generated, what style to follow.
        An AGENTS.md file at the root gives them these rules in plain language.

        In our survey of 50 open-source repositories that added AGENTS.md, maintainers reported fewer
        agent pull requests that touched generated files. The survey is self-reported and small.

        Keep the file short: commands, boundaries, style. Update it when the build changes.
    llm:
      score:
