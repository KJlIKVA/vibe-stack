        scores: {novelty: 2, usefulness: 4, verifiability: 3, substance: 2, audience_fit: 2}
        hard_stops: []
        reason: Статья с тезисом, о котором есть смысл порассуждать; факты проверяемы
        claims:
          - "В статье сказано, что coding-агенты без записанных правил угадывают тестовую команду, сгенерированные папки и стиль."
          - "Автор советует положить в корень репозитория файл AGENTS.md с правилами простым языком."
          - "В опросе 50 open-source репозиториев с AGENTS.md мейнтейнеры сообщили о меньшем числе PR от агентов, которые трогают сгенерированные файлы; опрос маленький и основан на самоотчётах."
