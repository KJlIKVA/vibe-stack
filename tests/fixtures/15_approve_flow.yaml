          - {claim: "Автор советует положить в корень репозитория файл AGENTS.md с правилами простым языком.", status: supported, evidence: "первый абзац"}
          - {claim: "В опросе 50 open-source репозиториев с AGENTS.md мейнтейнеры сообщили о меньшем числе PR от агентов, которые трогают сгенерированные файлы; опрос маленький и основан на самоотчётах.", status: supported, evidence: "второй абзац"}
