      write: |
        🧠 <b>Мнение ИИ: зачем репозиторию AGENTS.md</b>

        <b>О чём статья</b> — в статье сказано, что coding-агенты без записанных правил угадывают тестовую команду, сгенерированные папки и стиль. Автор предлагает файл AGENTS.md в корне репозитория; в опросе 50 репозиториев мейнтейнеры отметили меньше PR от агентов в сгенерированные файлы.
        <b>Что здесь любопытно или спорно</b> — на наш взгляд, идея здравая, но доказательная база слабая: опрос маленький и основан на самоотчётах, так что это скорее наблюдение, чем результат.
        <b>Что с этим делать читателю</b> — начните с короткого файла: команды, границы, стиль — и обновляйте его вместе со сборкой.

        <a href="https://blog.example-dev.net/why-agents-need-agents-md">Статья</a> · #разбор
